services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: survival
      POSTGRES_USER: survival
      POSTGRES_PASSWORD: local-survival
    healthcheck:
      test: [CMD-SHELL, pg_isready -U survival -d survival]
      interval: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-test.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
